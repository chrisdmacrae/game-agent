services:
  postgres:
    image: postgres:17-alpine
    container_name: game-agent-postgres
    restart: unless-stopped
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: '${DB_DATABASE:-game_agent}'
      POSTGRES_USER: '${DB_USERNAME:-game_agent}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${DB_USERNAME:-game_agent}', '-d', '${DB_DATABASE:-game_agent}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
    name: game-agent-pgdata
    external: true
