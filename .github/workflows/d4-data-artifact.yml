name: d4-data-artifact

# Production never runs git: this job sparse-clones DiabloTools/d4data, builds a
# slim tarball plus a manifest (commit, buildVersion, sha256 per file) and
# uploads it to the private S3-compatible bucket the importer reads from.

on:
  schedule:
    - cron: '17 5 * * 2' # Tuesdays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  D4DATA_REPO: https://github.com/DiabloTools/d4data.git
  D4DATA_REF: master

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Sparse clone d4data
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            --branch "$D4DATA_REF" "$D4DATA_REPO" tree
          cd tree
          # No-cone patterns, kept in sync with D4DataSource::sparsePatterns().
          # No-cone (rather than cone) because the Texture group is ~142k files
          # of 3D material art and only the 2D atlas subset is wanted; root
          # files must then be listed explicitly.
          git sparse-checkout set --no-cone \
            /CoreTOC_flat.json \
            /GBID.json \
            /eGameBalanceType.json \
            /buildVersion.txt \
            /attributes.json \
            /attributeList.json \
            /json/base/meta/Power/ \
            /json/base/meta/PlayerClass/ \
            /json/base/meta/SkillKit/ \
            /json/base/meta/GenericSkillTree/ \
            /json/base/meta/ParagonBoard/ \
            /json/base/meta/ParagonNode/ \
            /json/base/meta/ParagonGlyph/ \
            /json/base/meta/ParagonGlyphAffix/ \
            /json/base/meta/ParagonThreshold/ \
            /json/base/meta/Item/ \
            /json/base/meta/ItemType/ \
            /json/base/meta/Aspect/ \
            /json/base/meta/Affix/ \
            /json/base/meta/GameBalance/ \
            /json/base/meta/Global/ \
            /json/base/meta/Season/ \
            /json/enUS_Text/meta/StringList/ \
            '/json/base/meta/Texture/2DUI_*' \
            '/json/base/meta/Texture/2DInventory_*'

      - name: Read commit and build version
        id: source
        run: |
          commit="$(git -C tree rev-parse HEAD)"
          build_version="$(tr -d '[:space:]' < tree/buildVersion.txt)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "short_sha=${commit:0:7}" >> "$GITHUB_OUTPUT"
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"

      - name: Build manifest.json
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
          BUILD_VERSION: ${{ steps.source.outputs.build_version }}
        # One python process hashes the whole tree; a shasum-per-file shell loop
        # takes over an hour on the ~50k files this checkout contains.
        run: |
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os

          # The tarball is built with --exclude-vcs, so the manifest must skip
          # the same files or extraction fails its integrity check.
          VCS_FILES = {'.gitignore', '.gitattributes', '.gitmodules', '.cvsignore'}

          files = {}
          for dirpath, dirnames, filenames in os.walk('tree'):
              dirnames[:] = [d for d in dirnames if d != '.git']
              for name in filenames:
                  if name in VCS_FILES:
                      continue
                  full = os.path.join(dirpath, name)
                  digest = hashlib.sha256()
                  with open(full, 'rb') as handle:
                      for chunk in iter(lambda: handle.read(1 << 20), b''):
                          digest.update(chunk)
                  files[os.path.relpath(full, 'tree')] = digest.hexdigest()

          manifest = {
              'commit': os.environ['COMMIT'],
              'buildVersion': os.environ['BUILD_VERSION'],
              'generatedAt': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'files': dict(sorted(files.items())),
          }

          # Written after the walk so the manifest never lists itself.
          with open('tree/manifest.json', 'w') as handle:
              json.dump(manifest, handle, indent=2)

          print(f'hashed {len(files)} files')
          PY

      - name: Create tarball
        run: tar --exclude-vcs -czf d4data.tar.gz -C tree .

      - name: Upload to bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.D4_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.D4_BUCKET_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
          BUCKET: ${{ secrets.D4_BUCKET_NAME }}
          ENDPOINT: ${{ secrets.D4_BUCKET_ENDPOINT }}
          VERSIONED_KEY: d4data/${{ steps.source.outputs.build_version }}-${{ steps.source.outputs.short_sha }}.tar.gz
        run: |
          aws s3 cp d4data.tar.gz "s3://$BUCKET/$VERSIONED_KEY" --endpoint-url "$ENDPOINT"
          aws s3 cp d4data.tar.gz "s3://$BUCKET/d4data/latest.tar.gz" --endpoint-url "$ENDPOINT"
          aws s3 cp tree/manifest.json "s3://$BUCKET/d4data/latest.manifest.json" --endpoint-url "$ENDPOINT"
