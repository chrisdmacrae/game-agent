  <title>Build Your Build</title>
  <!-- The 34px BYB square: ink-900 tile, ink-700 hairline, teal-400 letters.
       The letterforms are drawn as strokes rather than set in a font, so they
       rasterise the same everywhere and stay readable down to 16px. -->
